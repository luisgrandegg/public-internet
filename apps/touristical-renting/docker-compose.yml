services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: touristical
      POSTGRES_PASSWORD: touristical
      POSTGRES_DB: touristical_renting
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U touristical -d touristical_renting"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
