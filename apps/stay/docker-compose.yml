services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stay
      POSTGRES_PASSWORD: stay
      POSTGRES_DB: stay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stay -d stay"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
