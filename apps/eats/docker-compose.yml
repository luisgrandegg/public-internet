services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eats
      POSTGRES_PASSWORD: eats
      POSTGRES_DB: eats
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eats -d eats"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
